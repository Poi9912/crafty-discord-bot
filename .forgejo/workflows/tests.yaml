name: tests
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
      - '**/*compose*.yaml'
  workflow_call:
jobs:
  test:
    runs-on: docker
    container:
      image: node:lts-alpine
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Run tests
        run: npm test

      - name: Install Java (required for Sonar Scanner on Alpine)
        run: apk add --no-cache openjdk17-jre

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}
        run: npx sonarqube-scanner